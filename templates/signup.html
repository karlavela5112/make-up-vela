 {% extends 'layout.html' %}
 {% block titulo%} Registro {% endblock %}
 {% block contenido%}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:40px 0;">
    <div class="card shadow-lg" style="width:100%;max-width:400px;border-radius:18px;overflow:hidden;">
        <div class="card-body p-5">
            <h2 class="text-center mb-4" style="font-weight:700;color:#667eea;">Crear Cuenta</h2>
            <form method="POST" action="signup.html">
                <div class="mb-3">
                    <label for="email" class="form-label"><i class="fa-solid fa-envelope form-icon"></i> Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com" required>
                </div>
                <div class="mb-3">
                    <label for="contrasena" class="form-label"><i class="fa-solid fa-lock form-icon"></i> Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
                        <label class="form-check-label" for="recordar">Recuérdame</label>
                    </div>
                    <a href="#" style="font-size:13px;"><i class="fa-solid fa-key form-icon" style="margin-right:4px;"></i>¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn w-100" style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;font-weight:600;letter-spacing:1px;">Registrarse</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
