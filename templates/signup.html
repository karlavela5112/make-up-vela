{% extends 'layout.html' %}
{% block titulo%} Registro {% endblock %}
{% block contenido%}
    <nav class="navbar-custom">
        <div class="navbar-content">
            <a href="/" class="navbar-logo">
                <i class="fa-solid fa-sparkles"></i>
                MakeUp Vela
            </a>
            <div class="navbar-actions">
                <div class="cart-icon" onclick="toggleCart()">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <div class="auth-buttons">
                    <a href="/signin" class="btn-nav">
                        <i class="fa-solid fa-sign-in-alt"></i> Inicia Sesión
                    </a>
                    <a href="/signup" class="btn-nav active">
                        <i class="fa-solid fa-user-plus"></i> Regístrate
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="wrapper-centrado">
        <div class="container-registro">
            <div class="registro-header">
                <h1><i class="fa-solid fa-sparkles form-icon"></i>MakeUp Vela</h1>
                <p>Únete a nuestra comunidad de belleza</p>
            </div>

            <form class="registro-form" method="POST" action="/signup">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre"><i class="fa-solid fa-user form-icon"></i>Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo"><i class="fa-solid fa-envelope form-icon"></i>Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="telefono"><i class="fa-solid fa-phone form-icon"></i>Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+1 (555) 123-4567" required>
                </div>

                <div class="form-group">
                    <label for="clave"><i class="fa-solid fa-lock form-icon"></i>Contraseña</label>
                    <input type="password" id="clave" name="clave" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="confirmar"><i class="fa-solid fa-lock-open form-icon"></i>Confirmar Contraseña</label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" required>
                </div>

                <button type="submit" class="btn-registro">Registrarse</button>
            </form>

            <div class="registro-footer">
                <p>¿Ya tienes cuenta? <a href="/signin">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>
{% endblock %}
