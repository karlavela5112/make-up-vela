 <form class="login-form" method="POST" action="/login">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope form-icon"></i>Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="contrasena"><i class="fa-solid fa-lock form-icon"></i>Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
            </div>

            <div class="remember-forgot">
                <div class="form-check">
                    <input type="checkbox" id="recordar" name="recordar">
                    <label for="recordar">Recuérdame</label>
                </div>
                <a href="#"><i class="fa-solid fa-key form-icon" style="margin-right: 4px;"></i>¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
